<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · 深研</title><link rel="icon" href="/static/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/static/style.css?v=accounts1"><link rel="stylesheet" href="/static/accounts.css?v=20261106-register-login"></head>
<body class="login-page"><main class="login-card"><a class="brand" href="/"><img src="/static/mark.svg" width="36" height="36" alt=""><span>深研<small>Open Deep Research</small></span></a><div class="eyebrow">开始你的研究</div><h1>创建你的研究账号</h1><p class="login-intro">先创建账号，再登录你的专属研究空间。</p><form id="register-form"><label for="register-name">用户名</label><input id="register-name" autocomplete="username" maxlength="32" minlength="3" pattern="[a-z0-9][a-z0-9_-]{2,31}" placeholder="3–32 位小写字母、数字、下划线或短横线" required><label for="register-password">密码</label><input id="register-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="至少 12 个字符" required><label for="register-repeat">确认密码</label><input id="register-repeat" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><div id="login-error" class="error" role="alert" hidden></div><button class="primary" id="login-submit" type="submit">注册账号 →</button></form><p class="budget-hint">已有账号？<a href="/login">返回登录 →</a></p></main><script src="/static/register.js?v=20261106-register-login" defer></script></body></html>
